[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-guard"
version = "0.1.0"
description = "Lightweight local request protection for Python AI applications"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "TokenGuard Contributors" }
]
keywords = [
    "ai",
    "llm",
    "token-budget",
    "loop-detection",
    "safety"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

[tool.setuptools]
py-modules = ["token_guard"]
